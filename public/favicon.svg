<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A7BD5" />
      <stop offset="100%" stop-color="#3168B5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark circular background with subtle stroke -->
  <rect width="100" height="100" rx="24" fill="#0A0F1D" stroke="#3A7BD5" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Neural connections / Brain circuitry representation -->
  <g stroke="url(#grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left lobe arc -->
    <path d="M 40,28 C 22,28 16,38 16,50 C 16,62 22,72 40,72" opacity="0.85" />
    <!-- Right lobe arc -->
    <path d="M 60,28 C 78,28 84,38 84,50 C 84,62 78,72 60,72" opacity="0.85" />
    <!-- Central connection -->
    <path d="M 50,20 L 50,80" stroke-width="4" filter="url(#glow)" />
    <!-- Circuit pathways -->
    <path d="M 50,35 L 32,35 A 8,8 0 0,0 24,43" />
    <path d="M 50,65 L 32,65 A 8,8 0 0,1 24,57" />
    <path d="M 50,35 L 68,35 A 8,8 0 0,1 76,43" />
    <path d="M 50,65 L 68,65 A 8,8 0 0,0 76,57" />
    <path d="M 50,50 L 35,50" />
    <path d="M 50,50 L 65,50" />
  </g>
  <!-- Synaptic nodes (glowing dots) -->
  <g fill="#A5C6FF" filter="url(#glow)">
    <circle cx="50" cy="20" r="4.5" fill="#FFFFFF" />
    <circle cx="50" cy="80" r="4.5" fill="#FFFFFF" />
    <circle cx="24" cy="43" r="3.5" />
    <circle cx="24" cy="57" r="3.5" />
    <circle cx="76" cy="43" r="3.5" />
    <circle cx="76" cy="57" r="3.5" />
    <circle cx="35" cy="50" r="3.5" />
    <circle cx="65" cy="50" r="3.5" />
  </g>
</svg>
